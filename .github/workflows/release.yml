name: Build Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Baixar Motores para Windows
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -OutFile src-tauri/binaries/yt-dlp-x86_64-pc-windows-msvc.exe
          Invoke-WebRequest -Uri https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_extracted -Force
          $ffmpegPath = Get-ChildItem -Path ffmpeg_extracted -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1
          Copy-Item $ffmpegPath.FullName -Destination src-tauri/resources/ffmpeg.exe -Force
          
          # Whisper CLI
          Invoke-WebRequest -Uri https://github.com/ggml-org/whisper.cpp/releases/download/v1.9.1/whisper-blas-bin-x64.zip -OutFile whisper.zip
          Expand-Archive whisper.zip -DestinationPath whisper_extracted -Force
          $whisperPath = Get-ChildItem -Path whisper_extracted -Filter "main.exe" -Recurse | Select-Object -First 1
          Copy-Item $whisperPath.FullName -Destination src-tauri/binaries/whisper-cli-x86_64-pc-windows-msvc.exe -Force
          
          # Model GGML Base
          Invoke-WebRequest -Uri https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin -OutFile src-tauri/resources/ggml-base.bin

      - name: Instalar Dependências
        run: npm install

      - name: Compilar App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v1.0.0
          releaseName: 'GRAB v1.0.0'
          releaseDraft: false
          prerelease: false
